
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درگاه ثبت مکاتبات و نامه‌ها | انجمن شرکت‌های پخش دارو و مکمل اردبیل</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/misc/UI/Vazirmatn-UI-font-face.css">
  <style>
    :root {
      --bg-dark: #121417;
      --card-bg: #1a1e24;
      --input-bg: #22272f;
      --border-color: #2e3642;
      --accent-color: #00b4d8;
      --accent-hover: #0096c7;
      --text-main: #f8f9fa;
      --text-muted: #94a3b8;
      --error-color: #ef4444;
      --success-color: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; justify-content: center; align-items: flex-start; }
    .container { width: 100%; max-width: 720px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2.5rem 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header { text-align: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; }
    .header h1 { font-size: 1.4rem; color: var(--accent-color); margin-bottom: 0.5rem; }
    .header p { font-size: 0.9rem; color: var(--text-muted); }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.88rem; margin-bottom: 0.4rem; color: var(--text-main); }
    label .req { color: var(--accent-color); }
    input, select, textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
    textarea { resize: vertical; min-height: 90px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .captcha-wrap { display: flex; align-items: center; gap: 1rem; }
    .captcha-q { background: var(--input-bg); border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: 8px; font-weight: bold; color: var(--accent-color); white-space: nowrap; }
    .checkbox-wrap { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    .checkbox-wrap input { width: auto; margin: 0; cursor: pointer; }
    .btn-submit { width: 100%; margin-top: 1.5rem; padding: 0.85rem; background: var(--accent-color); color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { background: var(--border-color); cursor: not-allowed; }
    .msg-box { margin-top: 1.2rem; padding: 1rem; border-radius: 8px; font-size: 0.88rem; display: none; line-height: 1.6; }
    .msg-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error-color); color: #fca5a5; }
    .msg-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success-color); color: #86efac; text-align: center; }
    .tracking-badge { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); margin: 0.5rem 0; letter-spacing: 2px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>درگاه ثبت مکاتبات و نامه‌ها</h1>
    <p>انجمن صنفی کارفرمایی شرکت‌های پخش دارو و مکمل‌های انسانی استان اردبیل</p>
  </div>

  <form id="letterForm">
    <div class="row">
      <div class="form-group">
        <label>نام شرکت یا سازمان فرستنده <span class="req">*</span></label>
        <input type="text" id="sender" required placeholder="مثال: شرکت پخش البرز دارو">
      </div>
      <div class="form-group">
        <label>گیرنده در انجمن <span class="req">*</span></label>
        <input type="text" id="recipient" required value="دبیرخانه انجمن">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>شماره نامه فرستنده</label>
        <input type="text" id="outgoingNumber" placeholder="مثال: ۱۴۰۳/۱۰۲">
      </div>
      <div class="form-group">
        <label>تاریخ نامه فرستنده <span class="req">*</span></label>
        <input type="text" id="letterDate" required placeholder="مثال: ۱۴۰۳/۰۸/۰۱">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>نام رابط / پیگیر</label>
        <input type="text" id="contactName" placeholder="نام و نام خانوادگی رابط">
      </div>
      <div class="form-group">
        <label>شماره تماس مستقیم <span class="req">*</span></label>
        <input type="tel" id="phone" required placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹">
      </div>
    </div>

    <div class="form-group">
      <label>موضوع مکاتبه <span class="req">*</span></label>
      <input type="text" id="subject" required placeholder="عنوان مختصر نامه یا درخواست">
    </div>

    <div class="form-group">
      <label>خلاصه یا متن مکاتبه <span class="req">*</span></label>
      <textarea id="summary" required placeholder="توضیحات و شرح درخواست..."></textarea>
    </div>

    <div class="form-group">
      <label>پیوست (اختیاری - PDF یا عکس)</label>
      <input type="file" id="attachment" accept=".pdf,image/*">
    </div>

    <div class="form-group">
      <label>کد امنیتی ساده <span class="req">*</span></label>
      <div class="captcha-wrap">
        <span class="captcha-q" id="captchaQuestion"></span>
        <input type="number" id="captchaAnswer" required placeholder="پاسخ جمع را بنویسید">
      </div>
    </div>

    <div class="checkbox-wrap">
      <input type="checkbox" id="confirmData" required>
      <label for="confirmData">تأیید می‌کنم اطلاعات وارد شده صحیح است و با ثبت آن، اطلاعات به انجمن ارسال شود.</label>
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">ثبت نهایی مکاتبه</button>
  </form>

  <div id="msgError" class="msg-box msg-error"></div>
  <div id="msgSuccess" class="msg-box msg-success">
    <div>مکاتبه با موفقیت ثبت گردید.</div>
    <div>کد رهگیری شما:</div>
    <div class="tracking-badge" id="trackingCodeDisplay"></div>
    <div style="font-size: 0.8rem; color: var(--text-muted);">لطفاً این کد را جهت پیگیری نزد خود نگه دارید.</div>
  </div>
</div>

<script>
  const SUPABASE_PROJECT_ID = 'halyqkmvxpgxagmrvzpo';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbHlxa212eHBneGFnbXJ2enBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MjA4NzEsImV4cCI6MjEwNzI5Njg3MX0.0DM3HRWP0pAvuSSuMsV4VSPL9bFuYdN42HxclWirI6c';
  const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;

  let num1 = Math.floor(Math.random() * 9) + 1;
  let num2 = Math.floor(Math.random() * 9) + 1;
  document.getElementById('captchaQuestion').innerText = `${num1} + ${num2} = ؟`;

  function generateTracking() {
    const d = new Date();
    const rand = Math.floor(1000 + Math.random() * 9000);
    return `LET-${d.getFullYear().toString().slice(-2)}${String(d.getMonth()+1).padStart(2,'0')}-${rand}`;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('letterForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errBox = document.getElementById('msgError');
    const sucBox = document.getElementById('msgSuccess');
    const btn = document.getElementById('submitBtn');

    errBox.style.display = 'none';
    sucBox.style.display = 'none';

    if (parseInt(document.getElementById('captchaAnswer').value) !== (num1 + num2)) {
      errBox.innerText = 'پاسخ کد امنیتی اشتباه است. لطفاً دوباره محاسبه کنید.';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerText = 'در حال ارسال اطلاعات...';

    try {
      const tracking = generateTracking();
      const fileInput = document.getElementById('attachment');
      let attachmentNote = '';

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        if (file.size > 2 * 1024 * 1024) {
          throw new Error('حجم فایل پیوست نباید بیشتر از ۲ مگابایت باشد.');
        }
        const b64 = await fileToBase64(file);
        attachmentNote = JSON.stringify({ name: file.name, type: file.type, data: b64 });
      }

      // تنظیم همزمان tracking_code و tracking_no برای رفع قطعی ناسازگاری ستون‌ها
      const payload = {
        tracking_code: tracking,
        tracking_no: tracking,
        direction: 'وارده',
        status: 'در انتظار بررسی',
        letter_type: 'اداری',
        sender: document.getElementById('sender').value.trim(),
        outgoing_number: document.getElementById('outgoingNumber').value.trim() || 'ندارد',
        letter_date: document.getElementById('letterDate').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        recipient: document.getElementById('recipient').value.trim(),
        contact_person: document.getElementById('contactName').value.trim() || '—',
        phone: document.getElementById('phone').value.trim(),
        summary: document.getElementById('summary').value.trim(),
        attachment_note: attachmentNote,
        created_at: new Date().toISOString()
      };

      const response = await fetch(`${SUPABASE_URL}/rest/v1/letters`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(errText);
      }

      document.getElementById('letterForm').style.display = 'none';
      document.getElementById('trackingCodeDisplay').innerText = tracking;
      sucBox.style.display = 'block';

    } catch (err) {
      errBox.innerText = 'ثبت مکاتبه ناموفق بود: ' + err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.innerText = 'تلاش دوباره برای ثبت';
    }
  });
</script>

</body>
</html>
