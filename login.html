<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152e"><title>ورود کاربران | انجمن صنفی اردبیل</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{color-scheme:dark;--otp-cyan:#55d9ff;--otp-blue:#427aff}
body.otp-login-page{margin:0;min-height:100vh;overflow-x:hidden;font-family:Vazirmatn, sans-serif;color:#eff7ff;background:radial-gradient(ellipse at 50% 105%,#164c91 0,transparent 43%),radial-gradient(ellipse at 12% 30%,#102d63 0,transparent 38%),radial-gradient(ellipse at 88% 22%,#122b59 0,transparent 35%),linear-gradient(145deg,#040b19,#07152e 55%,#091a36)}
.otp-login-page:before,.otp-login-page:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.55;z-index:0}.otp-login-page:before{width:260px;height:260px;left:-95px;top:18%;background:radial-gradient(circle at 35% 30%,#a2f4ff 0,#318bff 18%,#143b8b 52%,transparent 72%);box-shadow:0 0 70px #158fff55}.otp-login-page:after{width:190px;height:190px;right:-50px;bottom:12%;background:radial-gradient(circle at 35% 30%,#d4f7ff 0,#5b9bff 20%,#193b87 58%,transparent 72%);box-shadow:0 0 70px #148bff66}
.login-shell{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:34px 18px;box-sizing:border-box}.login-glow{position:absolute;width:min(550px,90vw);height:135px;bottom:8%;border-radius:50%;background:#178fff;filter:blur(75px);opacity:.19;pointer-events:none}.otp-card{position:relative;width:min(100%,440px);box-sizing:border-box;padding:34px 36px 27px;border:1px solid rgba(169,220,255,.23);border-radius:28px;background:linear-gradient(145deg,rgba(18,42,77,.77),rgba(8,23,49,.74));box-shadow:0 28px 90px #0008,inset 0 1px 0 #ffffff1c,0 0 38px #168aff20;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.brand-mark{width:58px;height:58px;margin:0 auto 17px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#93efff,#3f87ff 55%,#8b76ff);box-shadow:0 0 32px #36baff78}.brand-mark img{width:43px;height:43px;object-fit:contain;filter:drop-shadow(0 2px 5px #001)}.login-heading{text-align:center;margin-bottom:25px}.login-heading h1{font-size:23px;margin:0 0 7px;font-weight:700;letter-spacing:-.3px}.login-heading p{margin:0;color:#a8bbd4;font-size:13px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:22px;border:1px solid #ffffff14;background:#06142b80;border-radius:13px;gap:4px}.auth-tab{border:0;border-radius:10px;padding:10px;background:transparent;color:#9fb4ce;font:inherit;font-size:13px;cursor:pointer;transition:.2s}.auth-tab[aria-selected="true"]{background:linear-gradient(120deg,#1b5590,#174177);color:#fff;box-shadow:inset 0 0 0 1px #75caff38}.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:#cfdded;margin:0 2px 8px}.input-wrap{position:relative}.input-wrap input{box-sizing:border-box;width:100%;height:49px;border-radius:13px;border:1px solid #bfdcff24;background:#04132a8c;color:#fff;padding:0 44px 0 45px;font:inherit;font-size:14px;outline:none;transition:.2s}.input-wrap input::placeholder{color:#7e94b0}.input-wrap input:focus{border-color:#58c9ffb8;box-shadow:0 0 0 3px #55cfff16}.field-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#75b9e8;font-size:17px;pointer-events:none}.show-pass{position:absolute;left:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#a5bbd5;padding:8px;cursor:pointer;font-size:17px}.primary-btn{width:100%;min-height:49px;margin-top:5px;border:1px solid #a4eaff55;border-radius:14px;background:linear-gradient(110deg,#168ed8,#3479f6 60%,#5577ff);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 9px 26px #167ce64a;transition:transform .18s,filter .18s}.primary-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.primary-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.form-message{display:none;border-radius:11px;padding:10px 12px;margin:0 0 14px;font-size:12px;line-height:1.8}.form-message.show{display:block}.form-message.error{background:#ff525218;border:1px solid #ff64645c;color:#ffaaaa}.form-message.success{background:#36dba018;border:1px solid #36dba04d;color:#a9ffdc}.otp-panel{display:none}.otp-panel.active{display:block}.otp-code{direction:ltr;text-align:center;letter-spacing:.55em;font-size:25px!important;font-weight:700;padding-inline:16px!important}.otp-hint{font-size:11px;color:#8ea7c4;text-align:center;line-height:1.9;margin:12px 0 0}.demo-code{display:none;margin:12px 0 0;padding:10px 12px;text-align:center;border-radius:11px;border:1px dashed #67ceff70;background:#2a9bd314;color:#c9f2ff;font-size:12px;line-height:1.8}.demo-code.show{display:block}.resend-row{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 0;font-size:11px;color:#92a8c3}.text-action{border:0;background:none;color:#69d8ff;font:inherit;cursor:pointer;padding:4px}.text-action:disabled{color:#778aa1;cursor:not-allowed}.login-foot{text-align:center;border-top:1px solid #ffffff14;padding-top:17px;margin-top:22px;color:#8fa4bd;font-size:11px;line-height:1.9}.login-foot a{color:#78d8ff;text-decoration:none}.back-home{display:block;text-align:center;margin-top:11px;color:#a8bbd4;font-size:12px;text-decoration:none}.back-home:hover{color:#fff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){.login-shell{padding:20px 14px}.otp-card{padding:28px 22px 23px;border-radius:23px}.login-heading h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body class="otp-login-page"><main class="login-shell"><div class="login-glow" aria-hidden="true"></div><section class="otp-card" aria-labelledby="loginTitle">
<div class="brand-mark"><img src="assets/iphsda_logo.webp" alt="نشان انجمن صنفی اردبیل"></div>
<header class="login-heading"><h1 id="loginTitle">به حساب کاربری خود وارد شوید</h1><p>خوشحالیم که دوباره می‌بینیمت!</p></header>
<div class="auth-tabs" role="tablist" aria-label="روش ورود"><button id="passwordTab" class="auth-tab" type="button" role="tab" aria-selected="true" aria-controls="passwordPanel">ورود با رمز عبور</button><button id="otpTab" class="auth-tab" type="button" role="tab" aria-selected="false" aria-controls="otpPanel">ورود با کد یکبارمصرف</button></div>
<div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
<section id="passwordPanel" role="tabpanel" aria-labelledby="passwordTab"><form id="passwordForm" novalidate>
<div class="field"><label for="identifier">ایمیل یا شماره موبایل</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">✉</span><input id="identifier" name="identifier" type="text" autocomplete="username" inputmode="email" placeholder="ایمیل یا شماره موبایل" required></div></div>
<div class="field"><label for="password">رمز عبور</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">⌑</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="رمز عبور" required><button class="show-pass" type="button" id="togglePassword" aria-label="نمایش یا پنهان‌کردن رمز عبور" aria-pressed="false">◉</button></div></div>
<button class="primary-btn" type="submit">ورود به حساب <span aria-hidden="true">←</span></button></form></section>
<section id="otpPanel" class="otp-panel" role="tabpanel" aria-labelledby="otpTab" hidden>
<form id="requestOtpForm" novalidate><div class="field"><label for="otpIdentifier">ایمیل یا شماره موبایل</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">✉</span><input id="otpIdentifier" name="otpIdentifier" type="text" autocomplete="email" inputmode="email" placeholder="مثال: name@example.com یا 0912…" required></div></div><button class="primary-btn" type="submit">ارسال کد تأیید <span aria-hidden="true">←</span></button><p class="otp-hint">در نسخهٔ نمایشی، کد تأیید روی همین صفحه نمایش داده می‌شود.</p></form>
<form id="verifyOtpForm" hidden novalidate><div class="field"><label for="otpCode">کد چهاررقمی</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">▦</span><input id="otpCode" class="otp-code" name="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required aria-describedby="otpDemoCode"></div></div><button class="primary-btn" type="submit">تأیید و ورود <span aria-hidden="true">←</span></button><div class="demo-code" id="otpDemoCode" role="status" aria-live="polite"></div><div class="resend-row"><span id="otpExpiry">کد تا ۵ دقیقه معتبر است.</span><button id="resendOtp" class="text-action" type="button" disabled>ارسال مجدد</button></div><button id="changeIdentifier" class="text-action" type="button" style="margin-top:9px">ویرایش ایمیل/شماره</button></form></section>
<footer class="login-foot">ورود آزمایشی با رمز: <b dir="ltr">admin / admin</b><br>سامانهٔ OTP این نسخه شبیه‌سازی شده و پیامکی/ایمیلی ارسال نمی‌کند.</footer><a class="back-home" href="intro.html">بازگشت به صفحهٔ خوش‌آمدگویی</a>
</section></main>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id), tabs=[$('passwordTab'),$('otpTab')], message=$('formMessage');
function alertMessage(text,type){message.textContent=text;message.className='form-message show '+type}
function clearMessage(){message.textContent='';message.className='form-message'}
function validIdentifier(value){const v=value.trim();return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||/^\+?[0-9٠-٩۰-۹][0-9٠-٩۰-۹\s()\-]{6,18}$/.test(v)}
function safeReturn(){const raw=new URLSearchParams(location.search).get('return');if(!raw)return 'index.html';try{const decoded=raw;if(decoded.startsWith('/')||decoded.includes('\\')||decoded.includes('://')||decoded.split('/').includes('..'))return 'index.html';return decoded||'index.html'}catch(e){return 'index.html'}}
function login(identifier,role){const clean=identifier.trim();const user={username:clean,role:role||'user'};try{sessionStorage.setItem('sandika_user',JSON.stringify(user));localStorage.setItem('sandika_user',JSON.stringify(user));sessionStorage.setItem('sandika_authenticated','1')}catch(e){}location.href=safeReturn()}
tabs.forEach((tab,index)=>tab.addEventListener('click',()=>{clearMessage();tabs.forEach((t,i)=>t.setAttribute('aria-selected',String(i===index)));$('passwordPanel').hidden=index!==0;$('otpPanel').hidden=index===0;$('otpPanel').classList.toggle('active',index===1);if(index===1)$('otpIdentifier').focus()}));
$('togglePassword').addEventListener('click',()=>{const input=$('password'),show=input.type==='password';input.type=show?'text':'password';$('togglePassword').setAttribute('aria-pressed',String(show));$('togglePassword').setAttribute('aria-label',show?'پنهان‌کردن رمز عبور':'نمایش رمز عبور')});
$('passwordForm').addEventListener('submit',e=>{e.preventDefault();clearMessage();const user=$('identifier').value.trim(),pass=$('password').value;if(!user||!pass){alertMessage('ایمیل/شماره و رمز عبور را وارد کنید.','error');return}if(user.toLowerCase()==='admin'&&pass==='admin'){login('admin','manager');return}alertMessage('اطلاعات ورود معتبر نیست. برای ورود آزمایشی از admin / admin استفاده کنید یا روش OTP را انتخاب کنید.','error')});
let currentCode='',expiresAt=0,timer=null,tries=0;
function updateCountdown(){const left=Math.max(0,Math.ceil((expiresAt-Date.now())/1000));if(left<=0){$('otpExpiry').textContent='کد منقضی شده است.';$('resendOtp').disabled=false;clearInterval(timer);return}$('otpExpiry').textContent='زمان باقی‌مانده: '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('resendOtp').disabled=left>240}
function requestCode(){const who=$('otpIdentifier').value.trim();if(!validIdentifier(who)){alertMessage('یک ایمیل معتبر یا شمارهٔ موبایل معتبر وارد کنید.','error');$('otpIdentifier').focus();return}clearMessage();currentCode=String(Math.floor(1000+Math.random()*9000));expiresAt=Date.now()+300000;tries=0;$('otpDemoCode').innerHTML='کد نمایشی شما: <strong dir="ltr" style="letter-spacing:.2em">'+currentCode+'</strong><br>این کد فقط برای آزمایش است و به مقصد ارسال نشده.';$('otpDemoCode').classList.add('show');$('requestOtpForm').hidden=true;$('verifyOtpForm').hidden=false;$('otpCode').value='';$('otpCode').focus();if(timer)clearInterval(timer);updateCountdown();timer=setInterval(updateCountdown,1000);alertMessage('کد چهاررقمی آزمایشی ساخته شد.','success')}
$('requestOtpForm').addEventListener('submit',e=>{e.preventDefault();requestCode()});$('resendOtp').addEventListener('click',requestCode);$('changeIdentifier').addEventListener('click',()=>{clearInterval(timer);currentCode='';$('verifyOtpForm').hidden=true;$('requestOtpForm').hidden=false;$('otpDemoCode').classList.remove('show');clearMessage();$('otpIdentifier').focus()});$('otpCode').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9٠-٩۰-۹]/g,'').replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).slice(0,4)});
$('verifyOtpForm').addEventListener('submit',e=>{e.preventDefault();clearMessage();const code=$('otpCode').value.trim();if(Date.now()>expiresAt){alertMessage('کد منقضی شده است؛ کد تازه درخواست کنید.','error');$('resendOtp').disabled=false;return}if(tries>=5){alertMessage('به‌دلیل چند تلاش ناموفق، کد تازه درخواست کنید.','error');return}if(code!==currentCode){tries++;alertMessage('کد واردشده نادرست است. ('+(5-tries)+' تلاش باقی‌مانده)','error');return}clearInterval(timer);login($('otpIdentifier').value.trim(),'user')});
})();
</script></body></html>
