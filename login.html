<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050d22"><title>ورود به حساب کاربری | انجمن صنفی اردبیل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>
<body class="login-page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="ambient ambient-three"></div>
  <main class="auth-stage">
    <div class="platform" aria-hidden="true"><i></i><b></b></div>
    <section class="auth-card" aria-labelledby="authTitle">
      <div class="card-sheen" aria-hidden="true"></div>
      <div class="brand-mark"><img src="assets/iphsda_logo.webp" alt="نشان انجمن صنفی پخش دارو استان اردبیل"></div>
      <div class="auth-heading"><h1 id="authTitle">به حساب کاربری خود <span>وارد شوید</span></h1><p>به فضای امن و هوشمند انجمن خوش آمدید</p></div>
      <div class="auth-tabs" role="tablist" aria-label="نوع حساب"><button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true" data-mode="login">ورود</button><button class="auth-tab" id="registerTab" type="button" role="tab" aria-selected="false" data-mode="register">ثبت‌نام</button><span class="tab-glider"></span></div>
      <div id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></div>
      <form id="authForm" autocomplete="on">
        <label class="field-label" for="identity">ایمیل یا شماره موبایل</label>
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
          <input id="identity" name="identity" type="text" placeholder="ایمیل یا شماره موبایل" autocomplete="username" required>
        </div>
        <label class="field-label password-label" for="password">رمز عبور</label>
        <div class="input-wrap password-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>
          <input id="password" name="password" type="password" placeholder="رمز عبور" autocomplete="current-password" minlength="6" required>
          <button class="eye-toggle" type="button" aria-label="نمایش رمز عبور" title="نمایش/پنهان کردن رمز"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
        </div>
        <button class="submit-button" type="submit"><span class="submit-label">ورود به حساب</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <div class="social-divider"><span>یا ورود با</span></div>
      <div class="social-buttons">
        <button type="button" class="social-button" data-provider="google"><svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 17.9l6.8-5.2Z"/><path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.7 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z"/></svg><span>Google</span></button>
        <button type="button" class="social-button" data-provider="apple"><svg class="apple-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5a4.3 4.3 0 0 0-3.4-1.8c-1.4-.2-2.8.9-3.5.9s-1.8-.9-3-.9a4.5 4.5 0 0 0-3.8 2.3c-1.6 2.8-.4 7 1.1 9.3.8 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.9-.7s1.8.7 3 .7 1.9-1.1 2.6-2.2a10 10 0 0 0 1.2-2.5 3.9 3.9 0 0 1-1.8-3.8ZM14.4 6a4.2 4.2 0 0 0 1-3 4.2 4.2 0 0 0-2.8 1.5 4 4 0 0 0-1 2.9A3.5 3.5 0 0 0 14.4 6Z"/></svg><span>Apple</span></button>
      </div>
      <p class="auth-footnote" id="authFootnote">حساب کاربری ندارید؟ <button type="button" data-switch="register">ثبت‌نام کنید</button></p>
      <a class="back-home" href="index.html">بازگشت به صفحه اصلی</a>
    </section>
    <p class="stage-caption">SECURE ACCESS <i></i> IPHSDA · ARDEBIL</p>
  </main>
</body>
</html>
