<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071832"><title>ورود به سامانه | انجمن صنفی پخش دارو اردبیل</title><link rel="stylesheet" href="style.css"><style>
:root{--lg-cyan:#38d9ff;--lg-blue:#398aff;--lg-ink:#07152e}.login-page{min-height:100vh;position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;padding:35px 18px;color:#f4faff;background:radial-gradient(ellipse at 50% 105%,rgba(19,144,255,.46),transparent 33%),radial-gradient(ellipse at 10% 10%,rgba(20,97,191,.32),transparent 40%),radial-gradient(ellipse at 90% 40%,rgba(34,89,191,.25),transparent 38%),linear-gradient(145deg,#050d20 0%,#0a1c39 53%,#07132a 100%)}
.login-page:before,.login-page:after{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none}.login-page:before{background:repeating-radial-gradient(ellipse at 50% 112%,transparent 0 53px,rgba(41,169,255,.12) 55px,transparent 58px);transform:perspective(500px) rotateX(34deg);mask-image:linear-gradient(transparent 25%,black 83%)}.login-page:after{background:radial-gradient(circle at 17% 24%,#83e8ff 0 1px,transparent 2px),radial-gradient(circle at 76% 16%,#83e8ff 0 1px,transparent 2px),radial-gradient(circle at 88% 73%,#83e8ff 0 1px,transparent 2px),radial-gradient(circle at 24% 80%,#83e8ff 0 1px,transparent 2px);opacity:.58}
.login-card{width:min(100%,440px);padding:34px 38px 28px;border:1px solid rgba(95,198,255,.45);border-radius:25px;background:linear-gradient(145deg,rgba(24,53,91,.78),rgba(8,24,49,.84));box-shadow:0 25px 85px #0008,0 0 35px #168aff30,inset 0 1px 0 #ffffff24;backdrop-filter:blur(22px);position:relative}.login-brand{display:grid;place-items:center;margin:0 auto 10px;width:60px;height:48px;filter:drop-shadow(0 0 13px #37cfff88)}.login-head{text-align:center;margin-bottom:24px}.login-head h1{font-size:21px;margin:7px 0;color:#f6fbff}.login-head p{font-size:13px;margin:0;color:#b5c9e2}.login-tabs{display:flex;gap:8px;padding:4px;border:1px solid #a4d8ff22;border-radius:12px;background:#05152a66;margin:0 0 20px}.login-tabs button{flex:1;border:0;border-radius:9px;padding:9px;color:#a8bad0;background:transparent;font:inherit;font-size:13px}.login-tabs .selected{color:#fff;background:linear-gradient(110deg,#167cd4,#356ee4);box-shadow:0 4px 15px #1788e844}.login-tabs button:disabled{opacity:.48;cursor:not-allowed}.login-note{font-size:11px;color:#91a9c5;text-align:center;margin:-10px 0 18px}.lg-field{margin-bottom:15px}.lg-field label{display:block;font-size:12px;color:#d6e5f5;margin:0 2px 7px}.lg-input-wrap{position:relative;display:flex;align-items:center}.lg-input-wrap input{width:100%;height:48px;border-radius:12px;border:1px solid #b3d8f52b;background:rgba(4,17,37,.66);color:#f6fbff;padding:0 43px 0 45px;font:inherit;font-size:13px;outline:none;direction:rtl;transition:.2s}.lg-input-wrap input::placeholder{color:#8097b1}.lg-input-wrap input:focus{border-color:#4ccaff;box-shadow:0 0 0 3px #39bfff1c}.field-icon{position:absolute;right:14px;color:#84bde9;font-size:16px;pointer-events:none}.show-pass{position:absolute;left:9px;border:0;background:none;color:#91b9dc;padding:6px 8px;cursor:pointer;font-size:16px}.login-error{display:none;padding:10px 12px;margin:0 0 14px;border:1px solid #ff8d9b55;border-radius:10px;background:#741b354c;color:#ffd1d7;font-size:12px;text-align:center}.login-submit{width:100%;height:48px;border:1px solid #72d8ff60;border-radius:12px;background:linear-gradient(105deg,#139de3,#326be7);color:#fff;font:inherit;font-weight:700;font-size:14px;box-shadow:0 8px 24px #087ee64a;cursor:pointer;transition:filter .2s,transform .2s}.login-submit:hover{filter:brightness(1.1);transform:translateY(-1px)}.login-submit:focus-visible,.show-pass:focus-visible,.login-tabs button:focus-visible{outline:2px solid #a4edff;outline-offset:2px}.or-divider{display:flex;align-items:center;gap:12px;color:#8fa7c2;font-size:11px;margin:17px 0}.or-divider:before,.or-divider:after{content:"";height:1px;background:#aec8e52b;flex:1}.social-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.social-unavailable{display:flex;justify-content:center;align-items:center;gap:8px;min-height:42px;border:1px solid #b3d8f52b;border-radius:11px;color:#99acc3;background:#06162b88;font-size:12px;opacity:.65;cursor:not-allowed}.login-foot{text-align:center;color:#a9bdd5;font-size:12px;margin:21px 0 0}.login-foot .signup-disabled{color:#55caff;text-decoration:underline;text-underline-offset:3px;cursor:not-allowed}.back-link{display:block;text-align:center;margin-top:17px;color:#8ca6c2;font-size:12px}.back-link:hover{color:#c9edff}.login-home{position:absolute;top:18px;right:20px;color:#adc4df;font-size:12px}.login-home:hover{color:#fff}@media(max-width:480px){.login-card{padding:28px 22px 24px;border-radius:20px}.login-head h1{font-size:19px}}
</style></head><body><main class="login-page"><a class="login-home" href="index.html">بازگشت به صفحهٔ اصلی</a><section class="login-card" aria-labelledby="loginTitle"><div class="login-brand" aria-hidden="true"><svg viewBox="0 0 100 52" width="58" height="40"><defs><linearGradient id="lg" x1="0" x2="1"><stop stop-color="#34e5ff"/><stop offset="1" stop-color="#7772ff"/></linearGradient></defs><path d="M50 26C37 9 25 6 15 15 3 26 13 44 26 42c9-1 16-10 24-16 8-6 15-15 24-16 13-2 23 16 11 27-10 9-22 6-35-11" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/></svg></div><header class="login-head"><h1 id="loginTitle">به حساب کاربری خود وارد شوید</h1><p>خوشحالیم که دوباره می‌بینیمت!</p></header><div class="login-tabs" role="tablist" aria-label="نوع حساب"><button type="button" class="selected" role="tab" aria-selected="true">ورود</button><button type="button" role="tab" aria-selected="false" disabled title="ثبت‌نام در این نسخه فعال نیست">ثبت‌نام (غیرفعال)</button></div><p class="login-note">ثبت‌نام و ورود اجتماعی در این نسخه در دسترس نیست.</p><div id="errorBox" class="login-error" role="alert" aria-live="polite"></div><form id="loginForm" novalidate><div class="lg-field"><label for="username">ایمیل یا شماره موبایل / نام کاربری</label><div class="lg-input-wrap"><span class="field-icon" aria-hidden="true">✉</span><input type="text" id="username" placeholder="ایمیل یا شماره موبایل" autocomplete="username" required></div></div><div class="lg-field"><label for="password">رمز عبور</label><div class="lg-input-wrap"><span class="field-icon" aria-hidden="true">⌑</span><input type="password" id="password" placeholder="رمز عبور" autocomplete="current-password" required><button class="show-pass" type="button" id="togglePassword" aria-label="نمایش رمز عبور" aria-pressed="false">◉</button></div></div><button type="submit" class="login-submit">ورود به حساب <span aria-hidden="true">←</span></button></form><div class="or-divider">یا ورود با</div><div class="social-row"><button class="social-unavailable" type="button" disabled aria-disabled="true"><b aria-hidden="true">G</b> Google — در دسترس نیست</button><button class="social-unavailable" type="button" disabled aria-disabled="true"><b aria-hidden="true">●</b> Apple — در دسترس نیست</button></div><p class="login-foot">حساب کاربری ندارید؟ <span class="signup-disabled" aria-disabled="true">ثبت‌نام (غیرفعال)</span></p><a href="intro.html" class="back-link">← بازگشت به صفحهٔ خوش‌آمدگویی</a></section></main><script>
(function(){'use strict';var form=document.getElementById('loginForm'),userInput=document.getElementById('username'),passInput=document.getElementById('password'),box=document.getElementById('errorBox'),toggle=document.getElementById('togglePassword');function message(text){box.textContent=text;box.style.display='block'}function hideMessage(){box.textContent='';box.style.display='none'}toggle.addEventListener('click',function(){var show=passInput.type==='password';passInput.type=show?'text':'password';toggle.setAttribute('aria-pressed',show?'true':'false');toggle.setAttribute('aria-label',show?'پنهان‌کردن رمز عبور':'نمایش رمز عبور')});form.addEventListener('submit',function(e){e.preventDefault();hideMessage();var user=userInput.value.trim(),pass=passInput.value.trim();if(!user){message('لطفاً ایمیل، شماره موبایل یا نام کاربری را وارد کنید.');userInput.focus();return}if(!pass){message('لطفاً رمز عبور را وارد کنید.');passInput.focus();return}/* Keep the existing app's credential check: no minlength is imposed. */if(user==='admin'){if(pass==='admin'){sessionStorage.setItem('sandika_user',JSON.stringify({username:'admin',role:'manager'}));sessionStorage.setItem('sandika_authenticated','1');location.href='index.html'}else{message('گذرواژه نادرست است. لطفاً اطلاعات ورود خود را بررسی کنید.')}}else{message('نام کاربری در سامانه ثبت نشده است.')}})})();
</script></body></html>
