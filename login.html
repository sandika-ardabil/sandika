<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050b1b"><title>ورود به حساب کاربری | انجمن صنفی پخش دارو اردبیل</title><link rel="stylesheet" href="style.css"><style>
:root{color-scheme:dark;--cyan:#36dcff;--blue:#2879ff;--white:#f4f9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:inherit}body{min-height:100vh;color:var(--white);background:radial-gradient(ellipse at 50% 88%,#073e81 0,transparent 27%),radial-gradient(ellipse at 18% 20%,#0d3674 0,transparent 34%),radial-gradient(ellipse at 85% 62%,#082b59 0,transparent 30%),linear-gradient(135deg,#030714,#07152d 55%,#030817);overflow-x:hidden}.login-scene{position:relative;isolation:isolate;min-height:100vh;display:grid;place-items:center;padding:38px 18px 76px;overflow:hidden}.login-scene:before,.login-scene:after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}.login-scene:before{width:min(90vw,900px);height:min(90vw,900px);border:1px solid #2b9dff24;box-shadow:0 0 75px #087bff16,inset 0 0 70px #087bff0c;left:-42%;top:-46%}.login-scene:after{width:min(100vw,1050px);height:250px;bottom:4%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#168dff48 0, #0875ff21 25%,transparent 68%);filter:blur(12px)}.orb{position:absolute;z-index:-1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#e7fbffb0,#54caff55 18%,#1686ff1c 55%,#2b84ff04 72%);border:1px solid #99ddff42;box-shadow:inset -8px -10px 22px #0582ff20,0 0 35px #0f8bff25;animation:float 8s ease-in-out infinite}.orb.one{width:82px;height:82px;top:13%;left:15%}.orb.two{width:36px;height:36px;top:26%;right:19%;animation-delay:-3s}.orb.three{width:56px;height:56px;bottom:17%;right:12%;animation-delay:-5s}.orb.four{width:24px;height:24px;bottom:29%;left:19%;animation-delay:-2s}@keyframes float{50%{transform:translateY(-16px) translateX(7px)}}.login-card{width:min(100%,445px);position:relative;padding:30px 38px 28px;border-radius:28px;border:1px solid #7bdcff55;background:linear-gradient(145deg,#112543d9,#08152fe8 58%,#101b35d9);box-shadow:0 25px 90px #0009,0 0 36px #087dff38,inset 0 1px 1px #e1f8ff45;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.login-card:before{content:"";position:absolute;inset:0 10% auto;height:1px;background:linear-gradient(90deg,transparent,#9ceeffd9,transparent);box-shadow:0 0 15px #4bcfff}.login-header{text-align:center;margin:0 0 25px}.brand-logo{width:96px;height:96px;display:block;object-fit:contain;margin:0 auto 12px;filter:drop-shadow(0 0 15px #22aaff70)}.login-header h1{font-size:22px;line-height:1.7;color:#f5faff;margin:0;font-weight:800}.login-header h1 span{color:#67dfff;text-shadow:0 0 18px #18aaff69}.login-header p{font-size:13px;color:#9fb7d5;margin:5px 0 0}.error-msg{background:#ef444426;border:1px solid #ef444466;color:#ff9b9b;padding:10px 14px;border-radius:11px;font-size:13px;margin-bottom:17px;display:none;text-align:center}.form-group{margin-bottom:15px}.form-group label{display:block;font-size:13px;color:#d1e4f9;margin:0 2px 8px}.input-wrap{position:relative}.field-icon{position:absolute;top:50%;left:15px;transform:translateY(-50%);width:20px;height:20px;color:#78cfff;pointer-events:none}.form-group input{display:block;width:100%;height:52px;background:#061126b8;border:1px solid #a6d5f52d;border-radius:13px;padding:0 16px 0 48px;color:#fff;font:inherit;font-size:14px;outline:none;transition:.2s}.form-group input::placeholder{color:#8ca4c1}.form-group input:focus{border-color:#49caffb8;box-shadow:0 0 0 3px #168dff20,0 0 20px #168dff20}.toggle-password{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:34px;padding:6px;border:0;background:transparent;color:#8fb6da;cursor:pointer}.toggle-password:hover{color:#62d9ff}.login-btn-submit{position:relative;width:100%;height:52px;margin-top:6px;border:1px solid #78dfff6b;border-radius:14px;background:linear-gradient(105deg,#13bce9 0%,#168bff 53%,#375cff 100%);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 26px #087bff50,inset 0 1px 0 #ffffff5c;transition:transform .18s,box-shadow .18s}.login-btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 32px #087bff75,inset 0 1px 0 #ffffff70}.login-btn-submit .arrow{display:inline-block;margin-right:9px;font-size:19px;vertical-align:-1px}.divider{display:flex;align-items:center;gap:13px;margin:21px 0 15px;color:#9ab1cd;font-size:12px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#9bc4e43c)}.divider:after{transform:scaleX(-1)}.social-row{display:flex;gap:12px}.social-btn{height:46px;flex:1;display:flex;align-items:center;justify-content:center;gap:9px;color:#eaf4ff;text-decoration:none;background:#ffffff09;border:1px solid #a5cce52b;border-radius:12px;font:inherit;font-size:13px;font-weight:600;transition:.2s}.social-btn:hover{background:#3c9cff15;border-color:#6bcfff70;transform:translateY(-1px)}.social-btn svg{width:19px;height:19px}.signup{margin:22px 0 0;text-align:center;color:#a6bad3;font-size:13px}.signup a{color:#62d8ff;font-weight:700;text-decoration:none}.signup a:hover{text-decoration:underline}.scene-back{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#96abc4;font-size:12px;text-decoration:none}.scene-back:hover{color:#65d9ff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){.login-scene{padding:22px 14px 64px}.login-card{padding:25px 22px 24px;border-radius:23px}.brand-logo{width:84px;height:84px}.login-header h1{font-size:20px}.orb.one{left:2%;top:9%}.orb.two{right:4%}.orb.three{right:2%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="login-scene"><span class="orb one" aria-hidden="true"></span><span class="orb two" aria-hidden="true"></span><span class="orb three" aria-hidden="true"></span><span class="orb four" aria-hidden="true"></span><section class="login-card" aria-labelledby="loginTitle"><header class="login-header"><img class="brand-logo" src="assets/iphsda_logo.webp" alt="لوگوی انجمن صنفی پخش دارو اردبیل"><h1 id="loginTitle">به حساب کاربری خود <span>وارد شوید</span></h1></header><div id="errorBox" class="error-msg" role="alert"></div><form id="loginForm" onsubmit="handleLogin(event)"><div class="form-group"><label class="sr-only" for="username">ایمیل یا شماره موبایل</label><div class="input-wrap"><input type="text" id="username" name="username" placeholder="ایمیل یا شماره موبایل" autocomplete="username" aria-label="ایمیل یا شماره موبایل" required><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></div></div><div class="form-group"><label class="sr-only" for="password">رمز عبور</label><div class="input-wrap"><input type="password" id="password" name="password" placeholder="رمز عبور" autocomplete="current-password" aria-label="رمز عبور" required><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg><button class="toggle-password" type="button" id="togglePassword" aria-label="نمایش رمز عبور" title="نمایش یا پنهان‌کردن رمز"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button type="submit" class="login-btn-submit">ورود به حساب <span class="arrow" aria-hidden="true">←</span></button></form><div class="divider">یا ورود با</div><div class="social-row"><a href="#" class="social-btn" aria-label="ورود با Google" onclick="return false"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.5H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.5a12 12 0 0 1 0-7v-5.3H5.8a20 20 0 0 0 0 17.6l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.2l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg><span>Google</span></a><a href="#" class="social-btn" aria-label="ورود با Apple" onclick="return false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.2c.02 2.14 1.88 2.85 1.9 2.86-.02.05-.3 1.04-.98 2.06-.59.87-1.2 1.74-2.16 1.76-.94.02-1.25-.57-2.34-.57s-1.43.55-2.32.59c-.93.03-1.64-.95-2.24-1.82-1.22-1.77-2.15-5-.9-7.18a3.48 3.48 0 0 1 2.95-1.8c.92-.02 1.79.62 2.35.62.56 0 1.62-.77 2.73-.66.46.02 1.77.19 2.61 1.42-.07.05-1.56.91-1.6 2.72ZM14.58 7c.5-.6.83-1.42.74-2.24-.72.03-1.6.48-2.12 1.08-.47.54-.88 1.38-.77 2.19.8.06 1.65-.41 2.15-1.03Z"/></svg><span>Apple</span></a></div><p class="signup">حساب کاربری ندارید؟ <a href="intro.html">ثبت‌نام کنید</a></p></section><a href="index.html" class="scene-back">بازگشت به صفحهٔ اصلی</a></main><script>
function handleLogin(e){e.preventDefault();const user=document.getElementById('username').value.trim(),pass=document.getElementById('password').value.trim(),box=document.getElementById('errorBox');box.style.display='none';box.textContent='';if(user==='admin'){if(pass==='admin'){sessionStorage.setItem('sandika_user',JSON.stringify({username:'admin',role:'manager'}));sessionStorage.setItem('sandika_authenticated','1');location.href='index.html';}else{box.textContent='گذرواژه نادرست است.';box.style.display='block';}}else{box.textContent='نام کاربری در سامانه ثبت نشده است.';box.style.display='block';}}
document.getElementById('togglePassword').addEventListener('click',function(){const field=document.getElementById('password'),visible=field.type==='password';field.type=visible?'text':'password';this.setAttribute('aria-label',visible?'پنهان‌کردن رمز عبور':'نمایش رمز عبور');document.getElementById('eyeIcon').style.opacity=visible?'.62':'1';});
</script><script src="auth.js"></script></body></html>
