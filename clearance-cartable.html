<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کارتابل مفاصاحساب | انجمن صنفی اردبیل</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="auth.js"></script>
<style>.cc-wrap{max-width:1050px;margin:0 auto;padding:28px 18px 70px}.cc-card{background:rgba(18,24,36,.82);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px)}.cc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.cc-entry{padding:18px;margin:14px 0;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}.cc-entry h2{margin:0 0 10px;color:#e8f7fa;font-size:1.15rem}.cc-meta{display:flex;gap:10px 22px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.cc-total{font-weight:800;color:var(--cyan)}.cc-breakdown{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.cc-empty{text-align:center;color:var(--muted);padding:28px}.cc-error{color:#ff9d9d}.cc-sync{font-size:.85rem;color:var(--muted)}</style></head><body>
<header class="site-header clearance-header"><div class="header-top-row"><a href="index.html" class="brand-right"><img src="assets/iphsda_logo.webp" alt="نشان انجمن صنفی اردبیل"></a><div class="marquee-center"><div class="marquee-text">انجمن صنفی کارفرمایی شرکت‌های پخش دارو و مکمل‌های انسانی استان اردبیل</div></div><div class="head-actions-left"><a class="login-btn-white" href="login.html">ورود کاربران</a></div></div></header>
<main class="inner-page"><section class="page-hero"><p class="eyebrow">خدمات اعضا</p><h1>کارتابل مفاصاحساب</h1><p>درخواست‌های ارسال‌شده و جمع مبلغ هر بخش</p></section><section class="cc-wrap"><div class="cc-actions"><a class="action secondary" href="clearance.html">بازگشت به ثبت مفاصاحساب</a><button id="refreshCartable" class="action primary" type="button">به‌روزرسانی</button></div><section class="cc-card"><p id="syncState" class="cc-sync" role="status"></p><div id="cartableEntries" aria-live="polite"></div></section></section></main>
<footer class="site-footer"><div><b>با هم برای سلامت جامعه</b><p>انجمن صنفی کارفرمایی شرکت‌های پخش دارو و مکمل‌های انسانی استان اردبیل</p></div></footer>
<script>(function(){'use strict';const KEY='sandika_clearance_cartable_v1',TABLE='clearance_cartable';const fa=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0)+' ریال';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function local(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}function render(rows){const host=document.getElementById('cartableEntries');if(!rows.length){host.innerHTML='<div class="cc-empty">درخواستی در کارتابل ثبت نشده است.</div>';return}host.innerHTML=rows.map(x=>'<article class="cc-entry"><h2>'+esc(x.pharmacy||'داروخانه')+'</h2><div class="cc-meta"><span>زمان ثبت: '+esc(x.submittedAt?new Date(x.submittedAt).toLocaleString('fa-IR'):'—')+'</span><span class="cc-total">جمع کل: '+fa(x.grandTotal)+'</span></div><div class="cc-breakdown"><span>فاکتورهای باز: '+fa(x.invoiceTotal)+'</span><span>چک‌های بین‌راهی: '+fa(x.interCheckTotal)+'</span><span>چک‌های برگشتی: '+fa(x.returnedCheckTotal)+'</span></div></article>').join('')}async function refresh(){const status=document.getElementById('syncState'),localRows=local();render(localRows);const cfg=window.SANDIKA_SUPABASE||{};if(!cfg.url||!cfg.anonKey){status.textContent='نمایش از ذخیره‌سازی محلی همین مرورگر؛ برای دسترسی مشترک، تنظیمات Supabase را در window.SANDIKA_SUPABASE وارد کنید.';return}try{const url=cfg.url.replace(/\/$/,'')+'/rest/v1/'+TABLE+'?select=*&order=submittedAt.desc';const r=await fetch(url,{headers:{apikey:cfg.anonKey,Authorization:'Bearer '+cfg.anonKey}});if(!r.ok)throw Error('HTTP '+r.status);const remote=await r.json();const map=new Map();[...remote,...localRows].forEach(x=>{if(x&&x.id)map.set(x.id,x)});const rows=Array.from(map.values()).sort((a,b)=>String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));render(rows);status.textContent='کارتابل با Supabase همگام‌سازی شد.'}catch(e){status.textContent='اتصال Supabase برقرار نشد؛ داده‌های محلی نمایش داده می‌شود.';status.classList.add('cc-error');console.warn(e)}}document.getElementById('refreshCartable').addEventListener('click',refresh);refresh()})();</script></body></html>
