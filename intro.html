<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خوش آمدید | انجمن صنفی اردبیل</title><link rel="stylesheet" href="style.css"><style>body{margin:0;overflow:hidden}</style></head><body><div id="welcome-splash" role="dialog" aria-label="صفحه خوش‌آمدگویی"><h1 class="splash-title">به سامانه انجمن خوش آمدید</h1><p class="splash-sub">برای ورود، روی دکمه زیر یا هر جای صفحه کلیک کنید</p><button class="splash-btn" type="button" onclick="location.href='index.html'">ورود به سامانه</button></div><script>(function(){var s=document.getElementById('welcome-splash');function go(){location.href='index.html'}s.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')go()});document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Enter')go()})})();</script></body></html>
